apiVersion: v1
kind: Namespace
metadata:
  name: qnetward-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qnetward-operator-sa
  namespace: qnetward-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qnetward-operator-role
rules:
  - apiGroups: ["qnetward.io"]
    resources: ["qnetwardclusters", "probemeshes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["qnetward.io"]
    resources: ["qnetwardclusters/status", "probemeshes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qnetward-operator-rolebinding
subjects:
  - kind: ServiceAccount
    name: qnetward-operator-sa
    namespace: qnetward-system
roleRef:
  kind: ClusterRole
  name: qnetward-operator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qnetward-operator
  namespace: qnetward-system
  labels:
    app.kubernetes.io/name: qnetward-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qnetward-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qnetward-operator
    spec:
      serviceAccountName: qnetward-operator-sa
      containers:
        - name: manager
          image: ghcr.io/quantum-axis/qnetward-operator:latest
          command:
            - /qnetward-operator
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
