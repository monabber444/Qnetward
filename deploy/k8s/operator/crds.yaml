apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: qnetwardclusters.qnetward.io
spec:
  group: qnetward.io
  names:
    kind: QnetwardCluster
    listKind: QnetwardClusterList
    plural: qnetwardclusters
    singular: qnetwardcluster
    shortNames:
      - qc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 3
                multiRegion:
                  type: boolean
                  default: true
                storage:
                  type: object
                  properties:
                    hotEngine:
                      type: string
                      enum: ["clickhouse", "timescaledb"]
                      default: "clickhouse"
                    coldStorageS3:
                      type: string
                      default: "s3://qnetward-cold-archive"
                mesh:
                  type: object
                  properties:
                    gossipMode:
                      type: string
                      enum: ["hswim", "flat"]
                      default: "hswim"
                    cellMaxNodes:
                      type: integer
                      default: 250
            status:
              type: object
              properties:
                activeProbes:
                  type: integer
                clusterHealth:
                  type: string
                leaderRegion:
                  type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: probemeshes.qnetward.io
spec:
  group: qnetward.io
  names:
    kind: ProbeMesh
    listKind: ProbeMeshList
    plural: probemeshes
    singular: probemesh
    shortNames:
      - pm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                cellID:
                  type: string
                region:
                  type: string
                superProbeReplicas:
                  type: integer
                  default: 2
                probeIntervalMs:
                  type: integer
                  default: 250
                targetSubnets:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                cellNodesCount:
                  type: integer
                p95LatencyMs:
                  type: number
